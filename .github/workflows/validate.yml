name: Static validation
on:
  push:
  pull_request:
jobs:
  syntax-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile k8sctl.py
      - name: Bash syntax
        run: bash -n scripts/guest/prepare-node.sh
      - name: Host recovery script syntax
        run: bash -n scripts/host/*.sh
      - name: Unit tests
        run: python -m unittest discover -s tests -v
