name: Static validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-unit-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned development tools
        run: python -m pip install --disable-pip-version-check ruff==0.13.2

      - name: Validate clean patches
        run: git log --check --oneline --all

      - name: Python lint and syntax
        run: |
          ruff check k8sctl.py scripts/check_markdown.py tests
          python -m py_compile k8sctl.py scripts/check_markdown.py

      - name: Documentation style
        run: python scripts/check_markdown.py

      - name: Bash syntax and lint
        run: |
          bash -n scripts/guest/prepare-node.sh scripts/host/*.sh
          shellcheck scripts/guest/prepare-node.sh scripts/host/*.sh

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI installer integration test
        run: |
          test_bin="$(mktemp -d)"
          K8SCTL_BIN_DIR="$test_bin" scripts/host/install-cli.sh --install
          "$test_bin/k8sctl" --version
          "$test_bin/ttk" --version
          K8SCTL_BIN_DIR="$test_bin" scripts/host/install-cli.sh --uninstall
          test ! -e "$test_bin/k8sctl"
          test ! -e "$test_bin/ttk"
          rmdir "$test_bin"
